<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Echoes of the Fallen Star</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background: #0a0a0f;
                font-family: "Courier New", monospace;
                overflow: hidden;
            }

            #loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1000;
                background: #0a0a0f url("./assets/images/ui/ShadowCreatureBackground.png") center
                    center / cover no-repeat;
            }

            #loading-screen::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(10, 10, 15, 0.7);
                z-index: 1;
            }

            #game-canvas {
                image-rendering: pixelated;
                image-rendering: crisp-edges;
                outline: none;
                display: none;
            }

            .ui-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
                pointer-events: none;
                padding: 40px;
                z-index: 2;
            }

            .title-container {
                margin-top: 60px;
                text-align: center;
            }

            .game-title {
                font-family: "Georgia", serif;
                font-size: 56px;
                font-weight: bold;
                letter-spacing: 4px;
                color: #e8f4f8;
                text-shadow: 0 0 20px rgba(100, 220, 255, 0.6),
                    0 0 40px rgba(100, 220, 255, 0.3),
                    2px 2px 0 rgba(0, 0, 0, 0.8);
                margin-bottom: 12px;
            }

            .subtitle {
                font-size: 16px;
                color: #6a8a9a;
                letter-spacing: 2px;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            }

            .bottom-ui {
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: flex-end;
            }

            .press-enter {
                text-align: center;
                font-size: 20px;
                color: #a0c8d8;
                letter-spacing: 3px;
                text-shadow: 0 0 10px rgba(100, 220, 255, 0.4);
                animation: breathe 2s ease-in-out infinite;
                background: linear-gradient(
                    to top,
                    rgba(10, 20, 30, 0.8),
                    transparent
                );
                padding: 20px;
                border-radius: 4px;
                transition: opacity 0.5s ease-out;
            }

            .press-enter.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .menu-container {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 30px;
                z-index: 2;
                opacity: 0;
                transition: opacity 0.5s ease-in;
                pointer-events: none;
            }

            .menu-container.visible {
                opacity: 1;
                pointer-events: auto;
            }

            .menu-button {
                background: linear-gradient(
                    to top,
                    rgba(10, 20, 30, 0.9),
                    rgba(20, 40, 60, 0.6)
                );
                border: 2px solid rgba(100, 220, 255, 0.3);
                color: #e8f4f8;
                font-family: "Courier New", monospace;
                font-size: 24px;
                letter-spacing: 3px;
                padding: 20px 50px;
                cursor: pointer;
                text-shadow: 0 0 10px rgba(100, 220, 255, 0.5),
                    2px 2px 0 rgba(0, 0, 0, 0.8);
                transition: all 0.3s ease;
                pointer-events: auto;
                min-width: 250px;
                text-align: center;
            }

            .menu-button:hover {
                background: linear-gradient(
                    to top,
                    rgba(20, 40, 60, 0.9),
                    rgba(30, 60, 90, 0.6)
                );
                border-color: rgba(100, 220, 255, 0.6);
                text-shadow: 0 0 20px rgba(100, 220, 255, 0.8),
                    2px 2px 0 rgba(0, 0, 0, 0.8);
                transform: translateY(-2px);
            }

            .menu-button:active {
                transform: translateY(0);
            }

            .menu-button.selected {
                background: linear-gradient(
                    to top,
                    rgba(20, 40, 60, 0.9),
                    rgba(30, 60, 90, 0.6)
                );
                border-color: rgba(100, 220, 255, 0.6);
                text-shadow: 0 0 20px rgba(100, 220, 255, 0.8),
                    2px 2px 0 rgba(0, 0, 0, 0.8);
            }

            .menu-button:disabled {
                opacity: 0.3;
                cursor: not-allowed;
                pointer-events: none;
            }

            .save-info {
                font-size: 14px;
                color: #6a8a9a;
                text-align: center;
                margin-top: 20px;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            }

            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 2000;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .modal-overlay.visible {
                opacity: 1;
                pointer-events: auto;
            }

            .modal {
                background: linear-gradient(to top, rgba(10, 20, 30, 0.95), rgba(20, 40, 60, 0.9));
                border: 2px solid rgba(100, 220, 255, 0.6);
                padding: 40px;
                max-width: 500px;
                text-align: center;
                box-shadow: 0 0 40px rgba(100, 220, 255, 0.3);
            }

            .modal-title {
                font-size: 24px;
                color: #e8f4f8;
                margin-bottom: 20px;
                text-shadow: 0 0 10px rgba(100, 220, 255, 0.5);
            }

            .modal-text {
                font-size: 16px;
                color: #a0c8d8;
                margin-bottom: 30px;
                line-height: 1.6;
            }

            .modal-buttons {
                display: flex;
                gap: 20px;
                justify-content: center;
            }

            .modal-button {
                background: linear-gradient(to top, rgba(10, 20, 30, 0.9), rgba(20, 40, 60, 0.6));
                border: 2px solid rgba(100, 220, 255, 0.3);
                color: #e8f4f8;
                font-family: "Courier New", monospace;
                font-size: 18px;
                padding: 15px 30px;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .modal-button:hover {
                border-color: rgba(100, 220, 255, 0.6);
                background: linear-gradient(to top, rgba(20, 40, 60, 0.9), rgba(30, 60, 90, 0.6));
            }

            @keyframes breathe {
                0%,
                100% {
                    opacity: 0.6;
                }
                50% {
                    opacity: 1;
                }
            }

            @media (max-width: 1200px) {
                .game-title {
                    font-size: 40px;
                }
                .press-enter {
                    font-size: 16px;
                }
            }

            @media (max-width: 768px) {
                .game-title {
                    font-size: 28px;
                    letter-spacing: 2px;
                }
                .subtitle {
                    font-size: 12px;
                }
                .press-enter {
                    font-size: 14px;
                }
                .ui-overlay {
                    padding: 20px;
                }
                .menu-button {
                    font-size: 18px;
                    padding: 15px 40px;
                    min-width: 200px;
                }
            }
        </style>
    </head>
    <body>
        <div id="loading-screen">
            <div class="ui-overlay">
                <div class="title-container">
                    <div class="game-title">ECHOES OF THE FALLEN STAR</div>
                    <div class="subtitle">A Shadowbound Action RPG</div>
                </div>
                <div class="bottom-ui">
                    <div class="press-enter" id="press-enter">
                        PRESS ENTER TO BEGIN
                    </div>
                </div>
                <div class="menu-container" id="menu-container">
                    <button class="menu-button" id="new-game-btn">
                        NEW GAME
                    </button>
                    <button class="menu-button" id="continue-btn">
                        CONTINUE
                    </button>
                    <button class="menu-button" id="instructions-btn">
                        INSTRUCTIONS
                    </button>
                    <div class="save-info" id="save-info"></div>
                </div>
            </div>
        </div>

        <!-- Confirmation Modal -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal">
                <div class="modal-title" id="modal-title">Confirm New Game</div>
                <div class="modal-text" id="modal-text">
                    Starting a new game will delete your current save. Are you sure?
                </div>
                <div class="modal-buttons">
                    <button class="modal-button" id="modal-confirm">CONFIRM</button>
                    <button class="modal-button" id="modal-cancel">CANCEL</button>
                </div>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>

        <script type="module">
            // Import SaveManager
            import SaveManager from './src/services/SaveManager.js';
            
            // Track current screen state
            let currentScreen = "loading"; // "loading", "menu", "game"
            let selectedOption = 0; // 0 = New Game, 1 = Continue, 2 = Instructions
            let previousSelectedOption = 0; // Track previous selection for sound
            let hasSaveFile = false;

            // Function to show menu buttons (fade in on same screen)
            window.showMenu = function () {
                const pressEnter = document.getElementById("press-enter");
                const menuContainer = document.getElementById("menu-container");
                const continueBtn = document.getElementById("continue-btn");
                const saveInfo = document.getElementById("save-info");

                // Check for save file
                hasSaveFile = SaveManager.hasSave();
                
                // Disable Continue button if no save
                if (!hasSaveFile) {
                    continueBtn.disabled = true;
                    selectedOption = 0; // Force selection to New Game
                    if (saveInfo) {
                        saveInfo.textContent = "No save file found - Start New Game";
                    }
                } else {
                    const info = SaveManager.getSaveInfo();
                    if (info && saveInfo) {
                        saveInfo.textContent = `Last save: ${info.dateString} at ${info.timeString}`;
                    }
                }

                // Hide "PRESS ENTER" text
                if (pressEnter) {
                    pressEnter.classList.add("hidden");
                }

                // Start background music (browsers require user interaction)
                if (window.startBackgroundMusic) {
                    window.startBackgroundMusic();
                }

                // Show menu buttons
                if (menuContainer) {
                    setTimeout(() => {
                        menuContainer.classList.add("visible");
                        currentScreen = "menu";
                        updateSelectedOption(false); // Don't play sound on initial load
                    }, 300); // Small delay for smoother transition
                }
            };

            // Function to hide title screen and start the game
            window.hideTitleScreen = function () {
                const loadingScreen = document.getElementById("loading-screen");
                loadingScreen.style.opacity = "0";
                loadingScreen.style.transition = "opacity 0.5s ease-out";
                currentScreen = "game";
                setTimeout(() => {
                    loadingScreen.style.display = "none";
                    document.getElementById("game-canvas").style.display =
                        "block";
                    if (window.startGame) {
                        window.startGame();
                    }
                }, 500);
            };

            function updateSelectedOption(playSound = true) {
                const newGameBtn = document.getElementById("new-game-btn");
                const continueBtn = document.getElementById("continue-btn");
                const instructionsBtn = document.getElementById("instructions-btn");

                // If Continue is disabled, skip it
                if (!hasSaveFile && selectedOption === 1) {
                    selectedOption = 2; // Jump to Instructions
                }

                // Play navigation sound only if selection actually changed
                if (
                    playSound &&
                    previousSelectedOption !== selectedOption &&
                    window.playMenuNavigate
                ) {
                    window.playMenuNavigate();
                }

                // Remove all selections
                newGameBtn.classList.remove("selected");
                continueBtn.classList.remove("selected");
                instructionsBtn.classList.remove("selected");

                // Add selection to current option
                if (selectedOption === 0) {
                    newGameBtn.classList.add("selected");
                } else if (selectedOption === 1) {
                    continueBtn.classList.add("selected");
                } else if (selectedOption === 2) {
                    instructionsBtn.classList.add("selected");
                }

                // Update previous selection
                previousSelectedOption = selectedOption;
            }

            function selectCurrentOption() {
                if (selectedOption === 0) {
                    // New Game
                    if (hasSaveFile) {
                        // Show confirmation modal
                        showModal(
                            "Confirm New Game",
                            "Starting a new game will delete your current save. Are you sure?",
                            () => {
                                SaveManager.deleteSave();
                                window.isNewGame = true;
                                window.hideTitleScreen();
                            }
                        );
                    } else {
                        window.isNewGame = true;
                        window.hideTitleScreen();
                    }
                } else if (selectedOption === 1) {
                    // Continue
                    if (!hasSaveFile) {
                        // Show error modal
                        showModal(
                            "No Save Found",
                            "There is no save file to continue from. Please start a New Game.",
                            null,
                            true
                        );
                    } else {
                        window.isNewGame = false;
                        window.hideTitleScreen();
                    }
                } else if (selectedOption === 2) {
                    // Instructions
                    window.showInstructions();
                }
            }

            function showModal(title, text, onConfirm, errorMode = false) {
                const overlay = document.getElementById("modal-overlay");
                const titleEl = document.getElementById("modal-title");
                const textEl = document.getElementById("modal-text");
                const confirmBtn = document.getElementById("modal-confirm");
                const cancelBtn = document.getElementById("modal-cancel");

                titleEl.textContent = title;
                textEl.textContent = text;

                if (errorMode) {
                    // Error mode: only show OK button
                    confirmBtn.textContent = "OK";
                    cancelBtn.style.display = "none";
                    confirmBtn.onclick = () => hideModal();
                } else {
                    // Confirmation mode: show both buttons
                    confirmBtn.textContent = "CONFIRM";
                    cancelBtn.style.display = "block";
                    confirmBtn.onclick = () => {
                        hideModal();
                        if (onConfirm) onConfirm();
                    };
                    cancelBtn.onclick = () => hideModal();
                }

                overlay.classList.add("visible");
            }

            function hideModal() {
                const overlay = document.getElementById("modal-overlay");
                overlay.classList.remove("visible");
            }

            // Wait for Enter key on loading screen
            let assetsLoaded = false;

            window.onAssetsLoaded = function () {
                console.log('Assets loaded, enabling Enter key');
                assetsLoaded = true;
            };
            
            // Debug: log when Enter is pressed
            console.log('Title screen script loaded');

            document.addEventListener("keydown", (e) => {
                // Only handle menu inputs if we're NOT in the game
                if (currentScreen === "game") {
                    return; // Ignore all menu input during gameplay
                }
                
                if (e.key === "Enter" || e.keyCode === 13) {
                    console.log('Enter pressed, currentScreen:', currentScreen, 'assetsLoaded:', assetsLoaded);
                    if (currentScreen === "loading" && assetsLoaded) {
                        console.log('Showing menu...');
                        if (window.showMenu) {
                            window.showMenu();
                        } else {
                            console.error('window.showMenu is not defined!');
                        }
                    } else if (currentScreen === "menu") {
                        selectCurrentOption();
                    } else {
                        console.log('Enter key ignored - currentScreen:', currentScreen, 'assetsLoaded:', assetsLoaded);
                    }
                } else if (currentScreen === "menu") {
                    if (
                        e.key === "ArrowUp" ||
                        e.keyCode === 38 ||
                        e.key === "w" ||
                        e.key === "W"
                    ) {
                        selectedOption = (selectedOption - 1 + 3) % 3;
                        // Skip Continue if no save
                        if (!hasSaveFile && selectedOption === 1) {
                            selectedOption = 0;
                        }
                        updateSelectedOption();
                    } else if (
                        e.key === "ArrowDown" ||
                        e.keyCode === 40 ||
                        e.key === "s" ||
                        e.key === "S"
                    ) {
                        selectedOption = (selectedOption + 1) % 3;
                        // Skip Continue if no save
                        if (!hasSaveFile && selectedOption === 1) {
                            selectedOption = 2;
                        }
                        updateSelectedOption();
                    }
                }
            });

            // Function to show instructions
            window.showInstructions = function() {
                // Hide title screen
                const loadingScreen = document.getElementById("loading-screen");
                loadingScreen.style.opacity = "0";
                loadingScreen.style.transition = "opacity 0.5s ease-out";
                currentScreen = "game";
                setTimeout(() => {
                    loadingScreen.style.display = "none";
                    document.getElementById("game-canvas").style.display = "block";
                    
                    // Import and show instructions state
                    import('./src/globals.js').then(({ stateMachine }) => {
                        import('./src/enums/GameStateName.js').then(({ default: GameStateName }) => {
                            stateMachine.change(GameStateName.Instructions);
                            // Start game loop if not already started
                            if (window.startGameLoop) {
                                window.startGameLoop();
                            }
                        });
                    });
                }, 500);
            };

            // Button handlers
            document.addEventListener("DOMContentLoaded", () => {
                const newGameBtn = document.getElementById("new-game-btn");
                const continueBtn = document.getElementById("continue-btn");
                const instructionsBtn = document.getElementById("instructions-btn");

                if (newGameBtn) {
                    newGameBtn.addEventListener("click", () => {
                        selectedOption = 0;
                        selectCurrentOption();
                    });
                    newGameBtn.addEventListener("mouseenter", () => {
                        selectedOption = 0;
                        updateSelectedOption();
                    });
                }

                if (continueBtn) {
                    continueBtn.addEventListener("click", () => {
                        selectedOption = 1;
                        selectCurrentOption();
                    });
                    continueBtn.addEventListener("mouseenter", () => {
                        selectedOption = 1;
                        updateSelectedOption();
                    });
                }

                if (instructionsBtn) {
                    instructionsBtn.addEventListener("click", () => {
                        selectedOption = 2;
                        selectCurrentOption();
                    });
                    instructionsBtn.addEventListener("mouseenter", () => {
                        selectedOption = 2;
                        updateSelectedOption();
                    });
                }
            });
        </script>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
